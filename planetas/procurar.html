<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Procurar Planeta</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="../index.html">
            Objetos Astronômicos
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="../index.html">Início</a>
        </div>
    </div>
</nav>

<main class="container mt-5">

    <h1>Procurar Planeta</h1>

    <form class="mt-4">

        <div class="mb-3">
            <label for="nome" class="form-label">Nome do planeta</label>
            <input type="text" class="form-control" id="nome" placeholder="Digite o nome do planeta">
        </div>

        <button type="submit" class="btn btn-primary">
            Procurar
        </button>

        <a href="../index.html" class="btn btn-secondary">
            Voltar
        </a>

    </form>

    <div class="card mt-5">
        <div class="card-header">
            Resultado da pesquisa
        </div>

        <div class="card-body">
            <h5 class="card-title">Dados do planeta</h5>

            <p class="card-text">
                Nome: -
            </p>

            <p class="card-text">
                Número de luas: -
            </p>

            <p class="card-text">
                Massa: -
            </p>

            <p class="card-text">
                Habitável: -
            </p>
        </div>
    </div>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
