<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Inserir Lua</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
        <a class="navbar-brand" href="../index.html">
            Objetos Astronômicos
        </a>

        <div class="navbar-nav">
            <a class="nav-link" href="../index.html">Início</a>
        </div>
    </div>
</nav>

<main class="container mt-5">

    <h1>Inserir Lua</h1>

    <form class="mt-4">

        <!-- String -->
        <div class="mb-3">
            <label for="nome" class="form-label">Nome da Lua</label>
            <input type="text" class="form-control" id="nome">
        </div>

        <!-- Int -->
        <div class="mb-3">
            <label for="crateras" class="form-label">Número de crateras</label>
            <input type="number" class="form-control" id="crateras">
        </div>

        <!-- Float -->
        <div class="mb-3">
            <label for="diametro" class="form-label">Diâmetro (km)</label>
            <input type="number" step="0.01" class="form-control" id="diametro">
        </div>

        <!-- Boolean -->
        <div class="mb-3 form-check">
            <input type="checkbox" class="form-check-input" id="atmosfera">
            <label class="form-check-label" for="atmosfera">
                Possui atmosfera
            </label>
        </div>

        <button type="submit" class="btn btn-primary">
            Inserir
        </button>

        <a href="../index.html" class="btn btn-secondary">
            Voltar
        </a>

    </form>

</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
